<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reliquats Fleux</title>

  <!-- ICÔNES ET CONFIGURATION APPLICATION -->
  <link rel="icon" type="image/png" href="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg?v=2">
  <link rel="apple-touch-icon" href="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg?v=2">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    /* VARIABLES THEME SOMBRE (Défaut) */
    :root[data-theme="dark"] {
      --primary: #ff6b00;
      --primary-hover: #e05e00;
      --secondary: #1e293b;
      --bg: #090d16;
      --card-bg: #131c2e;
      --text: #f8fafc;
      --border: #1e293b;
      --input-bg: rgba(255,255,255,0.03);
      --container-bg: rgba(255,255,255,0.02);
      --subtext: #94a3b8;
      --radius: 16px;
    }

    /* VARIABLES THEME CLAIR */
    :root[data-theme="light"] {
      --primary: #ff6b00;
      --primary-hover: #e05e00;
      --secondary: #e2e8f0;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --input-bg: #ffffff;
      --container-bg: #f1f5f9;
      --subtext: #64748b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* --- ACCUEIL --- */
    #home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      text-align: center;
      background: radial-gradient(circle at 50% 20%, var(--secondary) 0%, var(--bg) 70%);
    }

    .logo-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .home-logo-img {
      width: 85vw !important;
      max-width: 420px !important;
      height: auto !important;
      max-height: 180px !important;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
      display: block;
    }

    .app-subtitle {
      font-size: 1.1rem;
      color: var(--subtext);
      max-width: 480px;
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    .btn-start {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 107, 0, 0.4);
      transition: all 0.2s ease;
    }

    /* --- APPLICATION --- */
    #app-screen {
      display: none;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
      gap: 0.5rem;
    }

    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      margin-right: 1rem;
      background: white;
      padding: 0.4rem 0.75rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      height: 65px;
      max-width: 350px;
      border: 1px solid var(--border);
    }

    .header-brand img {
      height: 52px !important;
      width: auto !important;
      max-width: 100%;
      object-fit: contain;
    }

    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      position: relative;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .btn-nav-home {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }

    .btn-menu-hamburger {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 100;
      min-width: 230px;
      overflow: hidden;
      margin-top: 0.4rem;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      padding: 0.75rem 1rem;
      text-align: left;
      background: none;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      transition: background 0.2s ease;
    }

    .dropdown-item.danger {
      color: #f43f5e;
    }

    .dropdown-item:hover {
      background: rgba(128,128,128,0.1);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .search-box input {
      flex: 1;
      background: var(--input-bg);
    }

    .btn-search {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .photo-box-container {
      background: var(--container-bg);
      padding: 0.85rem;
      border-radius: 10px;
      border: 1px dashed var(--border);
      margin-bottom: 1rem;
      position: relative;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--subtext);
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
    }

    .previewWrapper {
      position: relative;
      margin-bottom: 0.75rem;
    }

    .previewWrapper img, .modal-photo-box img {
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    .photoPreview {
      max-height: 200px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
      background: rgba(0,0,0,0.1);
    }

    .btn-suppr-photo-interne {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(244, 63, 94, 0.9);
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .camera-controls {
      display: flex;
      gap: 0.5rem;
    }

    button.btn-main {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    button.btn-secondary {
      background-color: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .export-filter-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
      background: var(--container-bg);
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .export-filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--subtext);
    }

    .export-actions-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .input-date-custom {
      flex: 1;
      min-width: 140px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      background: var(--input-bg);
    }

    button.btn-pdf {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button.btn-select-all {
      background-color: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button.btn-sheets {
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button.btn-import {
      background-color: #8b5cf6;
      color: white;
      border: none;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .liste-commandes {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .commande-item-compact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--container-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
      gap: 0.75rem;
    }

    .commande-item-compact:hover {
      background: rgba(128,128,128,0.08);
    }

    .commande-select-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .commande-main-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-grow: 1;
    }

    .commande-num-badge {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--primary);
    }

    .commande-date-compact {
      font-size: 0.75rem;
      color: var(--subtext);
    }

    .commande-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-edit-small {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-delete-small {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: #f43f5e;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .section-header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-count {
      background: rgba(255, 107, 0, 0.15);
      color: var(--primary);
      border: 1px solid rgba(255, 107, 0, 0.4);
      padding: 0.35rem 0.75rem;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 800;
      white-space: nowrap;
    }

    @media (min-width: 900px) {
      .main-layout-desktop {
        display: grid;
        grid-template-columns: 440px 1fr;
        gap: 1.5rem;
        align-items: start;
      }
      .column-left {
        display: flex;
        flex-direction: column;
      }
      .column-right {
        display: flex;
        flex-direction: column;
      }
    }

    /* MODAL ZOOM */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      max-width: 95%;
      margin: auto;
    }

    .modal-title-badge {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--text);
      background: var(--card-bg);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-images-row {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .modal-photo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.85rem;
      border-radius: 14px;
      max-width: 320px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .modal-photo-box img {
      max-height: 42vh;
      border-radius: 8px;
      background: rgba(0,0,0,0.1);
    }

    .modal-ref-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      width: 100%;
    }

    .modal-ref-badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .modal-ref-badge {
      background: var(--primary);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .modal-fournisseur-badge {
      background: var(--secondary);
      color: var(--text);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .modal-barcode-badge {
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: monospace;
      border: none;
      display: inline-block;
    }

    .modal-qty-badge {
      background-color: #16a34a;
      color: #ffffff;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      display: inline-block;
    }

    .modal-article-remarque-box {
      background: rgba(255, 107, 0, 0.15);
      color: var(--text);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      border: 1px dashed var(--primary);
      width: 100%;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      .modal-images-row {
        flex-direction: column;
      }
      .modal-photo-box {
        max-width: 90vw;
      }
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    #print-area {
      display: none;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        background: white;
        color: black;
      }
      .print-title {
        font-size: 22px;
        color: #ff6b00;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .print-subtitle {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 20px;
        border-bottom: 2px solid #ff6b00;
        padding-bottom: 10px;
      }
      .print-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      .print-card {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        page-break-inside: avoid;
        background: #ffffff;
      }
      .print-card h3 {
        font-size: 16px;
        color: #0f172a;
        margin-bottom: 4px;
      }
      .print-card .date {
        font-size: 11px;
        color: #64748b;
        margin-bottom: 8px;
      }
      .print-photos-flex {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .print-photo-print-item {
        width: 48%;
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 8px;
      }
      .print-photos-flex img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
      }
      .print-fournisseur-label {
        font-size: 10px;
        font-weight: 600;
        color: #334155;
        background: #f1f5f9;
        padding: 2px;
        border-radius: 4px;
        text-align: center;
      }
      .print-ref-label {
        font-size: 10px;
        font-weight: bold;
        color: #ff6b00;
        background: #f8fafc;
        padding: 2px;
        border-radius: 4px;
        text-align: center;
      }
      .print-barcode-label {
        font-size: 10px;
        font-weight: bold;
        color: #ffffff;
        background-color: #0284c7;
        font-family: monospace;
        text-align: center;
        padding: 2px 4px;
        border-radius: 4px;
      }
      .print-qty-label {
        font-size: 10px;
        font-weight: bold;
        color: #ffffff;
        background-color: #16a34a;
        text-align: center;
        padding: 2px 4px;
        border-radius: 4px;
      }
      .print-art-remarque-label {
        font-size: 10px;
        font-weight: bold;
        color: #ff6b00;
        background: #fff7ed;
        padding: 2px;
        border-radius: 4px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- ACCUEIL -->
  <div id="home-screen">
    <div class="logo-container">
      <img class="home-logo-img" src="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg" style="border:0;" alt="Reliquats Fleux Logo" />
    </div>
    <p class="app-subtitle">Prenez en photo vos articles manquants et suivez vos numéros de commande.</p>
    <button class="btn-start" id="btnCommencer">🚀 Lancer les reliquats</button>
  </div>

  <!-- APPLICATION -->
  <div id="app-screen">
    <header>
      <div class="header-brand">
        <img src="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg" style="border:0;" alt="Reliquats Fleux Logo" />
      </div>
      
      <div class="header-controls">
        <button class="btn-nav-home" id="btnRetourAccueil">🏠 Accueil</button>
        <button class="btn-menu-hamburger" id="btnMenu" title="Menu options">☰</button>
        
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item" id="btnToggleTheme">
            ☀️ Mode Clair / Sombre
          </button>
          <button class="dropdown-item" id="btnToggleAdmin">
            🔒 Mode Admin : OFF
          </button>
          
          <div id="adminMenuOptions" style="display: none;">
            <button class="dropdown-item" id="btnExportBackup" style="color: #0284c7;">
              💾 Exporter une sauvegarde
            </button>
            <button class="dropdown-item" id="btnImportBackup" style="color: #8b5cf6;">
              📥 Restaurer une sauvegarde
            </button>
            <input type="file" id="fileRestoreJson" accept=".json" style="display: none;">
            <button class="dropdown-item danger" id="btnViderHistorique">
              🗑️ Vider l'historique
            </button>
            <button class="dropdown-item" id="btnToggleMaintenance" style="color: #f59e0b;">
              🛠️ Activer la maintenance
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="main-layout-desktop">
      <div class="column-left">
        <section class="card" style="padding: 1rem;">
          <div class="search-box">
            <input type="text" id="recherche" placeholder="🔍 Rechercher par numéro, fournisseur, EAN..." autocomplete="off">
            <button type="button" class="btn-search" id="btnLancerRecherche">Rechercher</button>
          </div>
        </section>

        <section class="card" id="sectionPreparation">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2 id="formTitle" style="font-size: 1.1rem; color:var(--primary);">Nvx reliquats</h2>

    function nettoyerCommandeObjet(cmd) {
      if (!cmd) return cmd;
      let rawNum = String(cmd.numero || '').trim();
      let rawDate = String(cmd.date || '').trim();

      let parts = [];
      if (rawNum.includes(';')) parts = rawNum.split(';');
      else if (rawNum.includes(',')) parts = rawNum.split(',');

      if (parts.length >= 2) {
        let p0 = parts[0].trim();
        let p1 = parts.trim();
        if (p0.includes('/')) {
          if (!rawDate || rawDate === 'undefined') rawDate = p0;
          rawNum = p1;
        } else {
          rawNum = p0;
        }
      }

      cmd.numero = rawNum;
      if (rawDate) cmd.date = rawDate;
      return cmd;
    }

    function chargerToutesLesDonnees() {
      db.ref('catalogue_photos').once('value').then((snapshot) => {
        const data = snapshot.val() || {};
        Object.keys(data).forEach(cle => {
          const item = data[cle];
          if (item) {
            if (item.refOriginale) catalogueArticles[item.refOriginale] = item;
            catalogueArticles[cle] = item;
            if (cle.startsWith("REF_")) {
              catalogueArticles[cle.replace("REF_", "")] = item;
            }
          }
        });
      });

      db.ref('commandes').once('value').then((snapshot) => {
        const data = snapshot.val() || {};
        Object.keys(data).forEach(key => {
          const cmd = data[key];
          if (cmd && cmd.articles) {
            cmd.articles.forEach(art => {
              if (art.ref && art.photo) {
                if (!catalogueArticles[art.ref]) catalogueArticles[art.ref] = {};
                catalogueArticles[art.ref].photo = art.photo;
                if (art.fournisseur) catalogueArticles[art.ref].fournisseur = art.fournisseur;
                if (art.codeBarre) catalogueArticles[art.ref].codeBarre = art.codeBarre;
                if (art.quantite !== undefined) catalogueArticles[art.ref].quantite = art.quantite;
                if (art.remarqueArticle) catalogueArticles[art.ref].remarqueArticle = art.remarqueArticle;
              }
            });
          }
        });
      });
    }

    db.ref('catalogue_photos').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      Object.keys(data).forEach(cle => {
        const item = data[cle];
        if (item) {

          }
        }
      });

    function compresserImage(dataUrl, callback) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDimension = 600;

        if (width > height && width > maxDimension) {
          height *= maxDimension / width;
          width = maxDimension;
        } else if (height > maxDimension) {
          width *= maxDimension / height;
          height = maxDimension;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = dataUrl;
    }

        </div>

        <div class="form-group" style="margin-bottom: 0.75rem;">
          <label>Référence article</label>
          <input type="text" class="input-ref" placeholder="Ex: QM6214" autocomplete="off" value="${refInit}">
        </div>

        <div class="form-group" style="margin-bottom: 0.75rem;">
          <label>Code-barres ligne (EAN)</label>
          <input type="text" class="input-barcode" placeholder="Ex: 5711173353217" autocomplete="off" value="${barcodeInit}">
        </div>

        <div class="form-group" style="margin-bottom: 0.75rem;">
          <label>Quantité</label>
          <input type="number" min="1" class="input-qte" placeholder="Ex: 3" autocomplete="off" value="${qteInit}">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label>💬 Remarque spécifique article</label>
          <input type="text" class="input-article-remarque" placeholder="Ex: Couleur spécifique, set incomplet..." autocomplete="off" value="${remArticleInit}">
        </div>
      `;

      const inputRef = bloc.querySelector('.input-ref');
      const inputFournisseur = bloc.querySelector('.input-fournisseur');
      const inputBarcode = bloc.querySelector('.input-barcode');
      const inputQte = bloc.querySelector('.input-qte');
      const inputArtRemarque = bloc.querySelector('.input-article-remarque');
      const previewWrapper = bloc.querySelector('.previewWrapper');
      const photoPreview = bloc.querySelector('.photoPreview');
      const btnSupprPhoto = bloc.querySelector('.btn-suppr-photo-interne');
      const fileGallery = bloc.querySelector('.fileGallery');
      const fileCamera = bloc.querySelector('.fileCamera');
      const btnGalerie = bloc.querySelector('.btn-galerie');
      const btnPhotoDirecte = bloc.querySelector('.btn-photo-directe');
      const btnRetirer = bloc.querySelector('.btn-retirer-article');

      let photoData = photoInit;

      function verifierAutocompletion() {
        const ref = inputRef.value.trim();
        if (!ref) return;

        const cleNorm = "REF_" + ref.replace(/[.#$\/\[\]]/g, "_");
        let item = catalogueArticles[ref] || catalogueArticles[cleNorm] || catalogueArticles["REF_" + ref];

        if (!item) {
          for (let c of commandes) {
            if (c.articles) {
              const foundArt = c.articles.find(a => a.ref === ref);
              if (foundArt) {
                item = { 
                  photo: foundArt.photo, 
                  fournisseur: foundArt.fournisseur, 
                  codeBarre: foundArt.codeBarre, 
                  quantite: foundArt.quantite,
                  remarqueArticle: foundArt.remarqueArticle
                };
                break;
              }
            }
          }
        }

        if (item && item.photo && !photoData) {
          photoData = item.photo;
          photoPreview.src = photoData;
          previewWrapper.style.display = 'block';
        }
        if (item && item.fournisseur && !inputFournisseur.value.trim()) {
          inputFournisseur.value = item.fournisseur;
        }
        if (item && item.codeBarre && !inputBarcode.value.trim()) {
          inputBarcode.value = item.codeBarre;
        }
        if (item && item.quantite !== undefined && inputQte.value == "1") {
          inputQte.value = item.quantite;
        }
        if (item && item.remarqueArticle && !inputArtRemarque.value.trim()) {
          inputArtRemarque.value = item.remarqueArticle;
        }
      }

      inputRef.addEventListener('input', verifierAutocompletion);
      inputRef.addEventListener('blur', verifierAutocompletion);

      btnGalerie.addEventListener('click', () => fileGallery.click());
      btnPhotoDirecte.addEventListener('click', () => fileCamera.click());

      function chargerFichiersArticle(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            compresserImage(event.target.result, (imageCompressee) => {
              photoData = imageCompressee;
              photoPreview.src = photoData;
              previewWrapper.style.display = 'block';

              const ref = inputRef.value.trim();
              if (ref) {
                const cle = "REF_" + ref.replace(/[.#$\/\[\]]/g, "_");
                db.ref('catalogue_photos/' + cle).update({
                  refOriginale: ref,
                  photo: photoData,
                  fournisseur: inputFournisseur.value.trim(),
                  codeBarre: inputBarcode.value.trim(),
                  quantite: Number(inputQte.value) || 1,
                  remarqueArticle: inputArtRemarque.value.trim()
                }).catch(() => {});
              }
            });
          };
          reader.readAsDataURL(file);
        }
      }

      fileGallery.addEventListener('change', chargerFichiersArticle);
      fileCamera.addEventListener('change', chargerFichiersArticle);

      btnSupprPhoto.addEventListener('click', () => {
        photoData = "";
        photoPreview.src = "";
        previewWrapper.style.display = 'none';
        fileGallery.value = "";
        fileCamera.value = "";
      });

      btnRetirer.addEventListener('click', () => {

          ref: inputRef.value.trim(),
          codeBarre: inputBarcode.value.trim(),
          quantite: Number(inputQte.value) || 1,
          remarqueArticle: inputArtRemarque.value.trim()
        };
      };

      articlesContainer.appendChild(bloc);
      mettreAJourIndiceArticles();
    }

    function mettreAJourIndiceArticles() {
      const blocs = articlesContainer.querySelectorAll('.article-block');
      blocs.forEach((b, idx) => {
        b.querySelector('.article-index').textContent = idx + 1;
      });
    }

    btnAjouterArticle.addEventListener('click', () => {
      ajouterBlocArticle();
    });

    db.ref('commandes').on('value', (snapshot) => {
      const data = snapshot.val();
      commandes = [];
      if (data) {
        if (Array.isArray(data)) {
          commandes = data.filter(Boolean).map(nettoyerCommandeObjet);
        } else {
          Object.keys(data).forEach(key => {
            let cmd = data[key];
            if (cmd) {
              if (!cmd.id) cmd.id = Number(key) || Date.now();
              cmd = nettoyerCommandeObjet(cmd);
              commandes.push(cmd);
            }
          });
        }
        commandes.sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0));
      }
      afficherGalerie(inputRecherche.value);
    }, (error) => {
      alert("Erreur de lecture Firebase : " + error.message);
    });

    function executerEnregistrement() {
      const numero = inputNumero.value.trim();
      const blocsArticles = articlesContainer.querySelectorAll('.article-block');

      if (!numero || blocsArticles.length === 0) {
        alert("Veuillez renseigner un numéro de commande et ajouter au moins un article.");
        return;
      }

      let articlesList = [];
      let hasValidRef = false;

      blocsArticles.forEach(b => {
        const data = b.getArticleData();
        if (data.ref) hasValidRef = true;
        articlesList.push(data);

        if (data.ref && data.photo) {
          const cle = "REF_" + data.ref.replace(/[.#$\/\[\]]/g, "_");
          db.ref('catalogue_photos/' + cle).update({
            refOriginale: data.ref,
            photo: data.photo,
            fournisseur: data.fournisseur,
            codeBarre: data.codeBarre,
            quantite: data.quantite,
            remarqueArticle: data.remarqueArticle
          }).catch(() => {});
        }
      });

      if (!hasValidRef) {
        alert("Veuillez renseigner au moins une référence article.");
        return;
      }

      btnEnregistrer.disabled = true;
      btnEnregistrer.textContent = "Enregistrement...";

      const idObjet = modeEditionId !== null ? modeEditionId : Date.now();
      const existingCmd = commandes.find(c => c.id === idObjet);
      
      const commandeData = {
        id: idObjet,
        numero: numero,
        articles: articlesList,
        date: modeEditionId !== null && existingCmd ? existingCmd.date : new Date().toLocaleDateString('fr-FR'),
        isNew: false 
      };

      db.ref('commandes/' + idObjet).set(commandeData)
        .then(() => {
          reinitialiserFormulaire();
          btnEnregistrer.disabled = false;
        })
        .catch((error) => {
          btnEnregistrer.disabled = false;
          btnEnregistrer.textContent = "Enregistrer les reliquats";
          alert("❌ ÉCHEC FIREBASE : " + error.message);
        });
    }

    btnEnregistrer.addEventListener('click', () => {
      requireAdmin(executerEnregistrement);
    });

    function reinitialiserFormulaire() {
      modeEditionId = null;
      inputNumero.value = "";
      articlesContainer.innerHTML = "";

      btnEnregistrer.textContent = "Enregistrer les reliquats";
      btnEnregistrer.disabled = false;
      btnAnnulerEdit.style.display = "none";
      formTitle.textContent = "Nvx reliquats";
    }

    btnNouvelleCommande.addEventListener('click', () => {
      reinitialiserFormulaire();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    btnAnnulerEdit.addEventListener('click', reinitialiserFormulaire);

    window.editerCommande = function(id, event) {
      if (event) event.stopPropagation();
      
      requireAdmin(() => {
        const item = commandes.find(c => c.id === id);
        if (!item) return;

        inputRecherche.value = "";
        modeEditionId = id;
        
        inputNumero.value = String(item.numero || '').trim();
        
        articlesContainer.innerHTML = "";
        if (item.articles && item.articles.length > 0) {
          item.articles.forEach(art => {
            ajouterBlocArticle({
              photo: art.photo || "",
              fournisseur: art.fournisseur || "",
              ref: art.ref || "",
              codeBarre: art.codeBarre || "",
              quantite: art.quantite !== undefined ? art.quantite : 1,
              remarqueArticle: art.remarqueArticle || ""
            });
          });
        }

        btnEnregistrer.textContent = "💾 Sauvegarder les modifications";
        btnAnnulerEdit.style.display = "inline-block";
        formTitle.textContent = "✏️ Modifier le reliquat " + inputNumero.value;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    };

    window.supprimerCommande = function(id, event) {
      if (event) event.stopPropagation();
      
      requireAdmin(() => {
        const item = commandes.find(c => c.id === id);
        if (!item) return;

        if (confirm(`Voulez-vous vraiment supprimer le reliquat ${item.numero} ?`)) {
          db.ref('commandes/' + id).remove()
            .then(() => {
              if (modeEditionId === id) reinitialiserFormulaire();
            });
        }
      });
    };

    btnExportBackup.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      requireAdmin(() => {
        db.ref('/').once('value').then(snapshot => {
          const fullData = snapshot.val() || {};
          const jsonString = JSON.stringify(fullData, null, 2);
          
          const blob = new Blob([jsonString], { type: "application/json;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const downloadAnchor = document.createElement('a');
          downloadAnchor.href = url;
          
          const dateJour = new Date().toISOString().slice(0, 10);
          downloadAnchor.download = `sauvegarde_reliquats_fleux_${dateJour}.json`;
          
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          
          setTimeout(() => {
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
          }, 100);
        });
      });
    });

    btnImportBackup.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      requireAdmin(() => {
        fileRestoreJson.click();
      });
    });

    fileRestoreJson.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const importedData = JSON.parse(event.target.result);
          if (confirm("⚠️ ATTENTION : Restaurer cette sauvegarde va remplacer les nœuds de données par ceux du fichier. Voulez-vous continuer ?")) {
            const updates = {};
            if (importedData.commandes) updates['commandes'] = importedData.commandes;
            if (importedData.catalogue_photos) updates['catalogue_photos'] = importedData.catalogue_photos;
            
            const payload = Object.keys(updates).length > 0 ? db.ref('/').update(updates) : db.ref('/').set(importedData);

            payload
              .then(() => {
                alert("✅ Restauration de la sauvegarde réussie !");
                fileRestoreJson.value = "";
                chargerToutesLesDonnees();
              })
              .catch(err => {
                alert("❌ Erreur lors de la restauration Firebase : " + err.message);
                fileRestoreJson.value = "";
              });
          } else {
            fileRestoreJson.value = "";
          }
        } catch (err) {
          alert("❌ Fichier de sauvegarde invalide.");
          fileRestoreJson.value = "";
        }
      };
      reader.readAsText(file, 'UTF-8');
    });

    btnViderHistorique.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      requireAdmin(() => {
        if (confirm("Voulez-vous vraiment effacer TOUT l'historique de la base de données ?")) {
          db.ref('commandes').remove()
            .then(() => {
              reinitialiserFormulaire();
            });
        }
      });
    });

    function afficherGalerie(filtre = "") {
      galerieCommandes.innerHTML = "";
      const dateFilterVal = dateFiltreExport ? dateFiltreExport.value : "";
      let targetDateFormatted = "";
      if (dateFilterVal) {
        const parts = dateFilterVal.split('-');
        targetDateFormatted = `${parts}/${parts}/${parts[0]}`;
      }

      const liste = commandes.filter(c => {
        if (!c) return false;
        if (targetDateFormatted && c.date !== targetDateFormatted) {
          return false;
        }
        const numeroStr = String(c.numero || '').toLowerCase();
        const filtreStr = String(filtre || '').toLowerCase();
        const numMatch = numeroStr.includes(filtreStr);
        const matchArt = c.articles && c.articles.some(art => 
          (art.fournisseur && String(art.fournisseur).toLowerCase().includes(filtreStr)) ||
          (art.ref && String(art.ref).toLowerCase().includes(filtreStr)) ||
          (art.codeBarre && String(art.codeBarre).toLowerCase().includes(filtreStr)) ||
          (art.remarqueArticle && String(art.remarqueArticle).toLowerCase().includes(filtreStr))
        );
        return numMatch || matchArt;
      });

      const nbCmd = liste.length;
      const totalArt = liste.reduce((acc, cmd) => {
        if (!cmd || !cmd.articles) return acc;
        return acc + cmd.articles.reduce((sum, art) => sum + (Number(art.quantite) || 1), 0);
      }, 0);
      badgeCount.textContent = `${nbCmd} cmd • ${totalArt} art`;

      if (liste.length === 0) {
        galerieCommandes.innerHTML = `<p style="text-align:center; color:var(--subtext); padding:1rem;">Aucun reliquat trouvé.</p>`;
        return;
      }

      liste.forEach(cmd => {
        const item = document.createElement('div');
        item.className = 'commande-item-compact';
        
        const nbArticles = cmd.articles ? cmd.articles.reduce((acc, a) => acc + (Number(a.quantite) || 1), 0) : 0;
        const nbArticlesText = `📦 (${nbArticles} article${nbArticles > 1 ? 's' : ''})`;

        item.innerHTML = `
          <input type="checkbox" class="commande-select-checkbox" data-id="${cmd.id}" onclick="event.stopPropagation()">
          <div class="commande-main-btn" onclick='ouvrirModal(${JSON.stringify(cmd).replace(/'/g, "&#39;")})'>
            <span>${nbArticlesText}</span>
            <div>
              <div class="commande-num-badge">N° ${cmd.numero || ''}</div>
              <div class="commande-date-compact">${cmd.date || ''}</div>
            </div>
          </div>
          <div class="commande-actions">
            <button class="btn-edit-small" onclick="editerCommande(${cmd.id}, event)">✏️ Modifier</button>
            <button class="btn-delete-small" onclick="supprimerCommande(${cmd.id}, event)" title="Supprimer">❌</button>
          </div>
        `;
        galerieCommandes.appendChild(item);
      });
    }

    let toutCoche = false;
    btnSelectAll.addEventListener('click', () => {
      const checkboxes = document.querySelectorAll('.commande-select-checkbox');
      toutCoche = !toutCoche;
      checkboxes.forEach(cb => cb.checked = toutCoche);
      btnSelectAll.innerHTML = toutCoche ? "☑️ Tout décocher" : "☑️ Tout cocher";
    });

    dateFiltreExport.addEventListener('change', () => {
      afficherGalerie(inputRecherche.value);
    });

    window.ouvrirModal = function(cmd) {
      modal.style.display = "flex";
      modalTitleBadge.innerHTML = `📦 N° ${cmd.numero || ''}`;
      modalImagesRow.innerHTML = "";

      if (cmd.articles) {
        cmd.articles.forEach(art => {
          const qte = art.quantite !== undefined ? art.quantite : 1;
          const texteRemarque = art.remarqueArticle || "";
          const box = document.createElement('div');
          box.className = 'modal-photo-box';
          box.innerHTML = `
            ${art.photo ? `<img src="${art.photo}" alt="Article">` : ''}
            <div class="modal-ref-group">
              <div class="modal-ref-badges">
                ${art.fournisseur ? `<div class="modal-fournisseur-badge">Fournisseur: ${art.fournisseur}</div>` : ''}
                ${art.ref ? `<div class="modal-ref-badge">Réf: ${art.ref}</div>` : ''}
              </div>
              <div style="display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap;">
                ${art.codeBarre ? `<div class="modal-barcode-badge">EAN: ${art.codeBarre}</div>` : ''}
                <div class="modal-qty-badge">Qte: ${qte}</div>
              </div>
              ${texteRemarque ? `<div class="modal-article-remarque-box">💬 ${texteRemarque}</div>` : ''}
            </div>
          `;
          modalImagesRow.appendChild(box);
        });
      }
    };

    closeModal.addEventListener('click', () => modal.style.display = "none");
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = "none";
    });

    function executerRecherche() {
      const valeur = inputRecherche.value.trim();
      afficherGalerie(valeur);
    }

    btnLancerRecherche.addEventListener('click', executerRecherche);
    inputRecherche.addEventListener('input', executerRecherche);
    inputRecherche.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executerRecherche();
    });

    fileImportCSV.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        let text = event.target.result;
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const lines = text.split(/\r\n|\n/).filter(l => l.trim() !== '');
        
        if (lines.length < 2) {
          alert("Le fichier CSV est vide ou invalide.");
          fileImportCSV.value = "";
          return;
        }

        db.ref('commandes').once('value').then(snapshot => {
          const existingData = snapshot.val() || {};
          let groupCommandes = {};

          Object.keys(existingData).forEach(key => {
            const item = existingData[key];
            if (item && item.numero) {
              groupCommandes[String(item.numero).trim()] = item;
            }
          });

          let parsedRowsCount = 0;

          for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            let cols = [];
            if (line.includes(';')) {
              cols = line.split(';').map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
            } else {
              cols = line.split(',').map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
            }

            if (cols.length < 7) continue;

            // CORRECTIF MAPPING CSV (0: date, 1: num cmd, 2: fournisseur, 3: ean, 4: ref, 5: remarque/designation, 6: qte)
            let dateCSV = cols[0] || '';
            let numeroClean = cols || '';
            let fournisseurCSV = cols || '';
            let barcodeCSV = cols || '';
            let refCSV = cols[4] || '';
            let remArtCSV = cols[5] || '';
            let qteCSV = Number(cols[6]) || 1;

            if (!numeroClean || !refCSV) continue;
            parsedRowsCount++;

            let photoAuto = "";
            const cleNorm = "REF_" + String(refCSV).replace(/[.#$\/\[\]]/g, "_");
            let catalogItem = catalogueArticles[refCSV] || catalogueArticles[cleNorm] || catalogueArticles["REF_" + refCSV];

            if (catalogItem && catalogItem.photo) {
              photoAuto = catalogItem.photo;
            } else {
              for (let c of commandes) {
                if (c.articles) {
                  const foundArt = c.articles.find(a => String(a.ref).trim() === String(refCSV).trim());
                  if (foundArt && foundArt.photo) {
                    photoAuto = foundArt.photo;
                    break;
                  }
                }
              }
            }

            const numClean = String(numeroClean).trim();

            if (!groupCommandes[numClean]) {
              const newId = Date.now() + i;
              groupCommandes[numClean] = {
                id: newId,
                numero: numClean,
                date: dateCSV.includes('/') ? dateCSV : new Date().toLocaleDateString('fr-FR'),
                articles: [{
                  photo: photoAuto,
                  fournisseur: fournisseurCSV,
                  ref: String(refCSV),
                  codeBarre: barcodeCSV,
                  quantite: qteCSV,
                  remarqueArticle: remArtCSV
                }]
              };
            } else {
              const cmd = groupCommandes[numClean];
              if (dateCSV) cmd.date = dateCSV;
              if (!cmd.articles) cmd.articles = [];
              const alreadyExists = cmd.articles.some(a => String(a.ref).trim() === String(refCSV).trim());
              if (!alreadyExists) {
                cmd.articles.push({
                  photo: photoAuto,
                  fournisseur: fournisseurCSV,
                  ref: String(refCSV),
                  codeBarre: barcodeCSV,
                  quantite: qteCSV,
                  remarqueArticle: remArtCSV
                });
              }
            }
          }

          const keys = Object.keys(groupCommandes);
          if (keys.length === 0) {
            alert("Aucune donnée valide n'a pu être lue dans ce fichier.");
            fileImportCSV.value = "";
            return;
          }

          if (confirm(`Voulez-vous importer et fusionner ces commandes ? (${parsedRowsCount} ligne(s) valide(s) traitée(s))`)) {
            let updates = {};
            keys.forEach(num => {
              const cmd = groupCommandes[num];
              updates[cmd.id] = cmd;
            });

            db.ref('commandes').update(updates)
              .then(() => {
                alert(`Importation réussie : ${keys.length} commande(s) mise(s) à jour / ajoutée(s) !`);
                fileImportCSV.value = "";
                if (dateFiltreExport) dateFiltreExport.value = "";
                afficherGalerie(inputRecherche.value);
              })
              .catch(err => {
                alert("Erreur lors de l'enregistrement Firebase : " + err.message);
                fileImportCSV.value = "";
              });
          } else {
            fileImportCSV.value = "";
          }
        });
      };
      reader.readAsText(file, 'utf-8');
    });

    btnImportSheets.addEventListener('click', () => {
      fileImportCSV.click();
    });

    btnExportSheets.addEventListener('click', () => {
      const dateSelect = dateFiltreExport.value;
      let listeAExporter = commandes;

      if (dateSelect) {
        const parts = dateSelect.split('-');
        const dateFormatee = `${parts}/${parts}/${parts[0]}`;
        listeAExporter = commandes.filter(cmd => cmd.date === dateFormatee);

        if (listeAExporter.length === 0) {
          alert(`Aucun reliquat trouvé pour la date du ${dateFormatee}.`);
          return;
        }
      } else {
        if (commandes.length === 0) {
          alert("L'historique est vide, aucun document à exporter.");
          return;
        }
      }

      let csvContent = "\uFEFF";
      csvContent += "Date;Numero de Commande;Fournisseur;Reference;CodeBarre;Quantite;RemarqueArticle\r\n";

      listeAExporter.forEach(cmd => {
        const date = `"${(cmd.date || "").replace(/"/g, '""')}"`;
        const numero = `"${(cmd.numero || "").replace(/"/g, '""')}"`;

        if (cmd.articles) {
          cmd.articles.forEach(art => {
            const f = `"${(art.fournisseur || "").replace(/"/g, '""')}"`;
            const r = `"${(art.ref || "").replace(/"/g, '""')}"`;
            const b = `"${(art.codeBarre || "").replace(/"/g, '""')}"`;
            const q = art.quantite !== undefined ? art.quantite : 1;
            const ra = `"${(art.remarqueArticle || "").replace(/"/g, '""')}"`;
            csvContent += `${date};${numero};${f};${r};${b};${q};${ra}\r\n`;
          });
        }
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `reliquats_export_${dateSelect || 'complet'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    btnExportPDF.addEventListener('click', () => {
      const checkboxesCochees = document.querySelectorAll('.commande-select-checkbox:checked');
      let listeAExporter = [];
      let titreExport = "Historique Reliquats";

      if (checkboxesCochees.length > 0) {
        const idsCoches = Array.from(checkboxesCochees).map(cb => Number(cb.getAttribute('data-id')));
        listeAExporter = commandes.filter(cmd => idsCoches.includes(cmd.id));
        titreExport = "Sélection de Reliquats";
      } else {
        const dateSelect = dateFiltreExport.value;
        if (dateSelect) {
          const parts = dateSelect.split('-');
          const dateFormatee = `${parts}/${parts}/${parts[0]}`;
          listeAExporter = commandes.filter(cmd => cmd.date === dateFormatee);
          titreExport = `Historique Reliquats - Date : ${dateFormatee}`;

          if (listeAExporter.length === 0) {
            alert(`Aucun reliquat trouvé pour la date du ${dateFormatee}.`);
            return;
          }
        } else {
          if (commandes.length === 0) {
            alert("L'historique est vide, aucun document à exporter.");
            return;
          }
          listeAExporter = commandes;
        }
      }

      const printArea = document.getElementById('print-area');
      const dateHeureExport = new Date().toLocaleString('fr-FR');

      let html = `
        <div class="print-title">${titreExport}</div>
        <div class="print-subtitle">Document généré le ${dateHeureExport} - Total : ${listeAExporter.length} enregistrement(s)</div>
        <div class="print-grid">
      `;

      listeAExporter.forEach(cmd => {
        html += `
          <div class="print-card">
            <h3>Commande : ${cmd.numero || ''}</h3>
            <div class="date">Date : ${cmd.date || ''}</div>
            <div class="print-photos-flex">
        `;

        if (cmd.articles) {
          cmd.articles.forEach(art => {
            const qte = art.quantite !== undefined ? art.quantite : 1;
            const texteRem = art.remarqueArticle || "";
            html += `
              <div class="print-photo-print-item">
                ${art.photo ? `<img src="${art.photo}" alt="Article">` : ''}
                ${art.fournisseur ? `<div class="print-fournisseur-label">Fournisseur: ${art.fournisseur}</div>` : ''}
                ${art.ref ? `<div class="print-ref-label">Réf: ${art.ref}</div>` : ''}
                <div style="display:flex; gap:2px; flex-wrap:wrap; justify-content:center;">
                  ${art.codeBarre ? `<div class="print-barcode-label">EAN: ${art.codeBarre}</div>` : ''}
                  <div class="print-qty-label">Qte: ${qte}</div>
                </div>
                ${texteRem ? `<div class="print-art-remarque-label">💬 ${texteRem}</div>` : ''}
              </div>
            `;
          });
        }

        html += `
            </div>
          </div>
        `;
      });

      html += `</div>`;
      printArea.innerHTML = html;

      setTimeout(() => {
        window.print();
      }, 300);
    });

    reinitialiserFormulaire();
  </script>
