<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reliquats Fleux</title>

  <link rel="icon" type="image/png" href="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg?v=2">
  <link rel="apple-touch-icon" href="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg?v=2">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    :root[data-theme="dark"] {
      --primary: #ff6b00;
      --primary-hover: #e05e00;
      --secondary: #1e293b;
      --bg: #090d16;
      --card-bg: #131c2e;
      --text: #f8fafc;
      --border: #1e293b;
      --input-bg: rgba(255,255,255,0.03);
      --container-bg: rgba(255,255,255,0.02);
      --subtext: #94a3b8;
      --radius: 16px;
    }

    :root[data-theme="light"] {
      --primary: #ff6b00;
      --primary-hover: #e05e00;
      --secondary: #e2e8f0;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --input-bg: #ffffff;
      --container-bg: #f1f5f9;
      --subtext: #64748b;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; }

    #home-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1rem; text-align: center;
      background: radial-gradient(circle at 50% 20%, var(--secondary) 0%, var(--bg) 70%);
    }
    .logo-container { width: 100%; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem; }
    .home-logo-img { width: 85vw !important; max-width: 420px !important; height: auto !important; max-height: 180px !important; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15)); display: block; }
    .app-subtitle { font-size: 1.1rem; color: var(--subtext); max-width: 480px; margin-bottom: 2rem; line-height: 1.4; }
    .btn-start { background-color: var(--primary); color: white; border: none; padding: 1rem 2rem; border-radius: 30px; font-size: 1.2rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(255, 107, 0, 0.4); }

    #app-screen { display: none; max-width: 1400px; margin: 0 auto; padding: 1rem; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid var(--border); gap: 0.5rem; }
    .header-brand { display: flex; align-items: center; justify-content: center; flex: 1; margin-right: 1rem; background: white; padding: 0.4rem 0.75rem; border-radius: 12px; height: 65px; max-width: 350px; border: 1px solid var(--border); }
    .header-brand img { height: 52px !important; width: auto !important; max-width: 100%; object-fit: contain; }
    .header-controls { display: flex; flex-direction: column; align-items: flex-end; position: relative; gap: 0.3rem; flex-shrink: 0; }
    .btn-nav-home, .btn-menu-hamburger { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.75rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 100; min-width: 230px; margin-top: 0.4rem; }
    .dropdown-menu.show { display: block; }
    .dropdown-item { width: 100%; padding: 0.75rem 1rem; text-align: left; background: none; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; color: var(--text); }
    .dropdown-item.danger { color: #f43f5e; }
    .dropdown-item:hover { background: rgba(128,128,128,0.1); }

    .card { background: var(--card-bg); border-radius: var(--radius); padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid var(--border); margin-bottom: 1.5rem; }
    .search-box { display: flex; gap: 0.5rem; align-items: center; }
    .search-box input { flex: 1; background: var(--input-bg); }
    .btn-search { background-color: var(--primary); color: white; border: none; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .form-group { margin-bottom: 1rem; }
    .photo-box-container { background: var(--container-bg); padding: 0.85rem; border-radius: 10px; border: 1px dashed var(--border); margin-bottom: 1rem; position: relative; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--subtext); }
    input, textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--input-bg); color: var(--text); outline: none; }
    .previewWrapper { position: relative; margin-bottom: 0.75rem; display: none; }
    .photoPreview { max-height: 200px; border-radius: 8px; border: 1px solid var(--border); display: block; background: rgba(0,0,0,0.1); }
    .btn-suppr-photo-interne { position: absolute; top: 8px; right: 8px; background: rgba(244, 63, 94, 0.9); color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .camera-controls { display: flex; gap: 0.5rem; }
    button.btn-main { background-color: var(--primary); color: white; border: none; padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
    button.btn-secondary { background-color: var(--secondary); color: var(--text); border: 1px solid var(--border); padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }

    .export-filter-container { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; background: var(--container-bg); padding: 0.75rem; border-radius: 10px; border: 1px solid var(--border); }
    .export-filter-label { font-size: 0.85rem; font-weight: 700; color: var(--subtext); }
    .export-actions-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .input-date-custom { flex: 1; min-width: 140px; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; font-size: 0.9rem; color: var(--text); background: var(--input-bg); }
    button.btn-pdf { background-color: #0284c7; color: white; border: none; padding: 0.6rem 0.85rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    button.btn-select-all { background-color: var(--secondary); color: var(--text); border: 1px solid var(--border); padding: 0.6rem 0.85rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    button.btn-sheets { background-color: #16a34a; color: white; border: none; padding: 0.6rem 0.85rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    button.btn-import { background-color: #8b5cf6; color: white; border: none; padding: 0.6rem 0.85rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }

    .liste-commandes { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
    .commande-item-compact { display: flex; align-items: center; justify-content: space-between; background: var(--container-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; cursor: pointer; gap: 0.75rem; }
    .commande-select-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
    .commande-main-btn { display: flex; align-items: center; gap: 0.75rem; flex-grow: 1; }
    .commande-num-badge { font-weight: bold; font-size: 1.05rem; color: var(--primary); }
    .commande-date-compact { font-size: 0.75rem; color: var(--subtext); }
    .commande-actions { display: flex; align-items: center; gap: 0.4rem; }
    .btn-edit-small { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-delete-small { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #f43f5e; padding: 0.35rem 0.5rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .section-header-flex { display: flex; align-items: center; justify-content: space-between; }
    .badge-count { background: rgba(255, 107, 0, 0.15); color: var(--primary); border: 1px solid rgba(255, 107, 0, 0.4); padding: 0.35rem 0.75rem; border-radius: 30px; font-size: 0.95rem; font-weight: 800; }

    @media (min-width: 900px) {
      .main-layout-desktop { display: grid; grid-template-columns: 440px 1fr; gap: 1.5rem; align-items: start; }
    }

    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); align-items: center; justify-content: center; padding: 1.5rem; flex-direction: column; overflow-y: auto; }
    .modal-content-container { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; max-width: 95%; margin: auto; }
    .modal-title-badge { font-size: 1.3rem; font-weight: bold; color: var(--text); background: var(--card-bg); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); }
    .modal-images-row { display: flex; gap: 1.25rem; flex-wrap: wrap; justify-content: center; max-width: 100%; }
    .modal-photo-box { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; background: var(--card-bg); border: 1px solid var(--border); padding: 0.85rem; border-radius: 14px; max-width: 320px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .modal-photo-box img { max-height: 42vh; border-radius: 8px; background: rgba(0,0,0,0.1); }
    .modal-ref-group { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; width: 100%; }
    .modal-ref-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; }
    .modal-ref-badge { background: var(--primary); color: white; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }
    .modal-fournisseur-badge { background: var(--secondary); color: var(--text); padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--border); }
    .modal-barcode-badge { background-color: #0284c7; color: #ffffff; font-weight: 700; padding: 0.25rem 0.65rem; border-radius: 6px; font-size: 0.8rem; font-family: monospace; }
    .modal-qty-badge { background-color: #16a34a; color: #ffffff; font-weight: 700; padding: 0.25rem 0.65rem; border-radius: 6px; font-size: 0.85rem; }
    .modal-article-remarque-box { background: rgba(255, 107, 0, 0.15); color: var(--text); padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-align: center; border: 1px dashed var(--primary); width: 100%; word-break: break-word; }
    .modal-close { position: absolute; top: 20px; right: 25px; color: white; font-size: 2rem; font-weight: bold; cursor: pointer; z-index: 1001; }

    #print-area { display: none; }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: white; color: black; }
      .print-title { font-size: 22px; color: #ff6b00; margin-bottom: 5px; font-weight: bold; }
      .print-subtitle { font-size: 12px; color: #64748b; margin-bottom: 20px; border-bottom: 2px solid #ff6b00; padding-bottom: 10px; }
      .print-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
      .print-card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; page-break-inside: avoid; background: #ffffff; }
      .print-photos-flex { display: flex; flex-wrap: wrap; gap: 8px; }
      .print-photo-print-item { width: 48%; display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
      .print-photos-flex img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; }
    }
  </style>
</head>
<body>

  <div id="home-screen">
    <div class="logo-container">
      <img class="home-logo-img" src="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg" style="border:0;" alt="Reliquats Fleux Logo" />
    </div>
    <p class="app-subtitle">Prenez en photo vos articles manquants et suivez vos numéros de commande.</p>
    <button class="btn-start" id="btnCommencer">🚀 Lancer les reliquats</button>
  </div>

  <div id="app-screen">
    <header>
      <div class="header-brand">
        <img src="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg" style="border:0;" alt="Reliquats Fleux Logo" />
      </div>
      
      <div class="header-controls">
        <button class="btn-nav-home" id="btnRetourAccueil">🏠 Accueil</button>
        <button class="btn-menu-hamburger" id="btnMenu" title="Menu options">☰</button>
        
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item" id="btnToggleTheme">☀️ Mode Clair / Sombre</button>
          <button class="dropdown-item" id="btnToggleAdmin">🔒 Mode Admin : OFF</button>
          
          <div id="adminMenuOptions" style="display: none;">
            <button class="dropdown-item" id="btnExportBackup" style="color: #0284c7;">💾 Exporter une sauvegarde</button>
            <button class="dropdown-item" id="btnImportBackup" style="color: #8b5cf6;">📥 Restaurer une sauvegarde</button>
            <input type="file" id="fileRestoreJson" accept=".json" style="display: none;">
            <button class="dropdown-item danger" id="btnViderHistorique">🗑️ Vider l'historique</button>
          </div>
        </div>
      </div>
    </header>

    <div class="main-layout-desktop">
      <div class="column-left">
        <section class="card" style="padding: 1rem;">
          <div class="search-box">
            <input type="text" id="recherche" placeholder="🔍 Rechercher par numéro, fournisseur, EAN..." autocomplete="off">
            <button type="button" class="btn-search" id="btnLancerRecherche">Rechercher</button>
          </div>
        </section>

        <section class="card" id="sectionPreparation">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2 id="formTitle" style="font-size: 1.1rem; color:var(--primary);">Nvx reliquats</h2>
            <button type="button" id="btnNouvelleCommande" style="background:var(--primary); color:white; border:none; padding:0.4rem 0.8rem; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.85rem;">➕ Nvx reliquats</button>
          </div>

          <div class="form-group">
            <label for="numeroCommande">N° de Commande</label>
            <input type="text" id="numeroCommande" name="no_autofill_cmd" autocomplete="off" placeholder="Ex: S-103567">
          </div>

          <div id="articlesContainer"></div>

          <div style="margin-bottom: 1rem; text-align: center;">
            <button type="button" id="btnAjouterArticle" style="background: transparent; border: 2px dashed var(--border); color: var(--primary); padding: 0.75rem; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer;">
              ➕ Ajouter un article pour cette commande
            </button>
          </div>

          <div style="display:flex; gap:0.5rem; margin-top: 1rem;">
            <button class="btn-main" id="btnEnregistrer">Enregistrer les reliquats</button>
            <button class="btn-secondary" id="btnAnnulerEdit" style="display:none; width:auto;">Annuler</button>
          </div>
        </section>
      </div>

      <div class="column-right">
        <section class="card" style="margin-bottom: 0;">
          <div class="section-header-flex">
            <h2>Historique Reliquats</h2>
            <span id="badgeCount" class="badge-count">0</span>
          </div>

          <div class="export-filter-container">
            <span class="export-filter-label">📅 Filtrer par date ou sélection pour l'export :</span>
            <div class="export-actions-row">
              <input type="date" id="dateFiltreExport" class="input-date-custom">
              <button class="btn-select-all" id="btnSelectAll">☑️ Tout cocher</button>
              <button class="btn-pdf" id="btnExportPDF">📄 Exporter PDF</button>
              
              <div id="adminExportOptions" style="display: none; gap: 0.5rem; align-items: center;">
                <button class="btn-sheets" id="btnExportSheets">🟢 Google Sheets</button>
                <input type="file" id="fileImportCSV" accept=".csv,.txt" style="display: none;">
                <button class="btn-import" id="btnImportSheets">📥 Importer CSV</button>
              </div>
            </div>
          </div>

          <div class="liste-commandes" id="galerieCommandes"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="print-area"></div>

  <div id="imageModal" class="modal">
    <span class="modal-close" id="closeModal">&times;</span>
    <div class="modal-content-container">
      <div id="modalTitleBadge" class="modal-title-badge"></div>
      <div class="modal-images-row" id="modalImagesRow"></div>
    </div>
  </div>

  <div id="adminLoginModal" class="modal" style="display: none; z-index: 2000;">
    <div style="background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 1rem;">
      <h3 style="color: var(--primary); font-size: 1.1rem; text-align: center;">🔒 Accès Administrateur</h3>
      <div style="position: relative;">
        <input type="password" id="adminPasswordInput" placeholder="Mot de passe admin" autocomplete="off" style="padding-right: 2.8rem; width: 100%;">
        <button type="button" id="btnTogglePasswordView" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--subtext); padding: 4px;">👁️</button>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn-main" id="btnSubmitAdminLogin" style="flex: 1;">Valider</button>
        <button type="button" class="btn-secondary" id="btnCancelAdminLogin" style="flex: 1;">Annuler</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABQ02OsMbEwLMl7k1hUMdQOCQQi1RdDVE",
      authDomain: "reliquats-fleux.firebaseapp.com",
      databaseURL: "https://reliquats-fleux-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "reliquats-fleux",
      storageBucket: "reliquats-fleux.firebasestorage.app",
      messagingSenderId: "591953313777",
      appId: "1:591953313777:web:c95b2e8aab6c9492f7ce50",
      measurementId: "G-Z8VKEX2MPV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ADMIN_PASSWORD = "Fleux.reliquats!";
    let estAdmin = false;

    let adminCallback = null;
    const adminLoginModal = document.getElementById('adminLoginModal');
    const adminPasswordInput = document.getElementById('adminPasswordInput');
    const btnTogglePasswordView = document.getElementById('btnTogglePasswordView');

    function ouvrirModaleAdmin(callback) {
      adminCallback = callback;
      adminPasswordInput.value = '';
      adminPasswordInput.type = 'password';
      btnTogglePasswordView.textContent = '👁️';
      adminLoginModal.style.display = 'flex';
      setTimeout(() => adminPasswordInput.focus(), 50);
    }

    btnTogglePasswordView.addEventListener('click', () => {
      adminPasswordInput.type = adminPasswordInput.type === 'password' ? 'text' : 'password';
      btnTogglePasswordView.textContent = adminPasswordInput.type === 'password' ? '👁️' : '🙈';
    });

    document.getElementById('btnCancelAdminLogin').addEventListener('click', () => {
      adminLoginModal.style.display = 'none';
      adminCallback = null;
    });

    function validerPasswordAdmin() {
      if (adminPasswordInput.value === ADMIN_PASSWORD) {
        adminLoginModal.style.display = 'none';
        estAdmin = true;
        btnToggleAdmin.innerHTML = "🔓 Mode Admin : ON";
        btnToggleAdmin.style.color = "#16a34a";
        adminMenuOptions.style.display = "block";
        adminExportOptions.style.display = "inline-flex";
        if (adminCallback) { const cb = adminCallback; adminCallback = null; cb(true); }
      } else {
        alert("❌ Code incorrect !");
        adminPasswordInput.value = '';
        adminPasswordInput.focus();
      }
    }

    document.getElementById('btnSubmitAdminLogin').addEventListener('click', validerPasswordAdmin);
    adminPasswordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') validerPasswordAdmin(); });

    function requireAdmin(actionFn) {
      if (estAdmin) { actionFn(); } else { ouvrirModaleAdmin((succ) => { if (succ) actionFn(); }); }
    }

    const htmlRoot = document.documentElement;
    const btnToggleTheme = document.getElementById('btnToggleTheme');
    const savedTheme = localStorage.getItem('reliquats_theme') || 'dark';
    htmlRoot.setAttribute('data-theme', savedTheme);
    btnToggleTheme.innerHTML = savedTheme === 'dark' ? "🌙 Mode Sombre (Actif)" : "☀️ Mode Clair (Actif)";

    btnToggleTheme.addEventListener('click', () => {
      const currentTheme = htmlRoot.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      htmlRoot.setAttribute('data-theme', newTheme);
      localStorage.setItem('reliquats_theme', newTheme);
      btnToggleTheme.innerHTML = newTheme === 'dark' ? "🌙 Mode Sombre (Actif)" : "☀️ Mode Clair (Actif)";
      dropdownMenu.classList.remove('show');
    });

    const homeScreen = document.getElementById('home-screen');
    const appScreen = document.getElementById('app-screen');
    const btnCommencer = document.getElementById('btnCommencer');
    const btnRetourAccueil = document.getElementById('btnRetourAccueil');
    const btnMenu = document.getElementById('btnMenu');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const btnToggleAdmin = document.getElementById('btnToggleAdmin');
    const adminMenuOptions = document.getElementById('adminMenuOptions');
    const adminExportOptions = document.getElementById('adminExportOptions');
    const badgeCount = document.getElementById('badgeCount');

    btnMenu.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); });
    document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

    btnToggleAdmin.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      if (!estAdmin) {
        ouvrirModaleAdmin((succ) => { if (succ) { alert("✅ Mode Admin ON"); afficherGalerie(inputRecherche.value); } });
      } else {
        estAdmin = false;
        btnToggleAdmin.innerHTML = "🔒 Mode Admin : OFF";
        btnToggleAdmin.style.color = "var(--text)";
        adminMenuOptions.style.display = "none";
        adminExportOptions.style.display = "none";
        alert("🔒 Mode Admin OFF");
        afficherGalerie(inputRecherche.value);
      }
    });

    btnCommencer.addEventListener('click', () => {
      homeScreen.style.display = 'none';
      appScreen.style.display = 'block';
      reinitialiserFormulaire();
      chargerToutesLesDonnees();
    });

    btnRetourAccueil.addEventListener('click', () => {
      reinitialiserFormulaire();
      inputRecherche.value = "";
      afficherGalerie();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    let commandes = [];
    let catalogueArticles = {};
    let modeEditionId = null;

    const inputNumero = document.getElementById('numeroCommande');
    const btnNouvelleCommande = document.getElementById('btnNouvelleCommande');
    const articlesContainer = document.getElementById('articlesContainer');
    const btnAjouterArticle = document.getElementById('btnAjouterArticle');
    const btnEnregistrer = document.getElementById('btnEnregistrer');
    const btnAnnulerEdit = document.getElementById('btnAnnulerEdit');
    const formTitle = document.getElementById('formTitle');
    const galerieCommandes = document.getElementById('galerieCommandes');
    const inputRecherche = document.getElementById('recherche');
    const btnLancerRecherche = document.getElementById('btnLancerRecherche');
    const btnViderHistorique = document.getElementById('btnViderHistorique');
    const btnExportBackup = document.getElementById('btnExportBackup');
    const btnImportBackup = document.getElementById('btnImportBackup');
    const fileRestoreJson = document.getElementById('fileRestoreJson');
    const btnExportPDF = document.getElementById('btnExportPDF');
    const btnSelectAll = document.getElementById('btnSelectAll');
    const btnExportSheets = document.getElementById('btnExportSheets');
    const btnImportSheets = document.getElementById('btnImportSheets');
    const fileImportCSV = document.getElementById('fileImportCSV');
    const dateFiltreExport = document.getElementById('dateFiltreExport');
    const modal = document.getElementById('imageModal');
    const modalTitleBadge = document.getElementById('modalTitleBadge');
    const modalImagesRow = document.getElementById('modalImagesRow');
    const closeModal = document.getElementById('closeModal');

    function nettoyerCommandeObjet(cmd) {
      if (!cmd) return cmd;
      let rawNum = String(cmd.numero || '').trim();
      let rawDate = String(cmd.date || '').trim();
      let parts = rawNum.includes(';') ? rawNum.split(';') : (rawNum.includes(',') ? rawNum.split(',') : []);
      if (parts.length >= 2) {
        let p0 = parts[0].trim();
        let p1 = parts[parts.length - 1].trim();
        if (p0.includes('/')) { if (!rawDate || rawDate === 'undefined') rawDate = p0; rawNum = p1; } else { rawNum = p0; }
      }
      cmd.numero = rawNum;
      if (rawDate) cmd.date = rawDate;
      return cmd;
    }

    function chargerToutesLesDonnees() {
      db.ref('catalogue_photos').once('value').then((snapshot) => {
        const data = snapshot.val() || {};
        Object.keys(data).forEach(cle => {
          const item = data[cle];
          if (item) {
            if (item.refOriginale) catalogueArticles[item.refOriginale] = item;
            catalogueArticles[cle] = item;
            if (cle.startsWith("REF_")) catalogueArticles[cle.replace("REF_", "")] = item;
          }
        });
      });
      db.ref('commandes').once('value').then((snapshot) => {
        const data = snapshot.val() || {};
        Object.keys(data).forEach(key => {
          const cmd = data[key];
          if (cmd && cmd.articles) {
            cmd.articles.forEach(art => {
              if (art.ref && art.photo) {
                if (!catalogueArticles[art.ref]) catalogueArticles[art.ref] = {};
                Object.assign(catalogueArticles[art.ref], art);
              }
            });
          }
        });
      });
    }

    db.ref('catalogue_photos').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      Object.keys(data).forEach(cle => {
        const item = data[cle];
        if (item) {
          if (item.refOriginale) catalogueArticles[item.refOriginale] = item;
          catalogueArticles[cle] = item;
          if (cle.startsWith("REF_")) catalogueArticles[cle.replace("REF_", "")] = item;
        }
      });
    });

    function compresserImage(dataUrl, callback) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        const maxDimension = 600;
        if (width > height && width > maxDimension) { height *= maxDimension / width; width = maxDimension; }
        else if (height > maxDimension) { width *= maxDimension / height; height = maxDimension; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = dataUrl;
    }

    function ajouterBlocArticle(dataArticle = null) {
      const index = articlesContainer.children.length + 1;
      const bloc = document.createElement('div');
      bloc.className = 'photo-box-container article-block';
      const photoInit = dataArticle?.photo || "";
      const fournisseurInit = dataArticle?.fournisseur || "";
      const refInit = dataArticle?.ref || "";
      const barcodeInit = dataArticle?.codeBarre || "";
      const qteInit = dataArticle?.quantite !== undefined ? dataArticle.quantite : 1;
      const remArticleInit = dataArticle?.remarqueArticle || "";

      bloc.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label style="margin-bottom: 0;">📸 Article n°<span class="article-index">${index}</span></label>
          <button type="button" class="btn-retirer-article" style="background: rgba(244, 63, 94, 0.2); border: none; color: #f43f5e; padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;">🗑️ Retirer</button>
        </div>
        <div class="previewWrapper" style="display: ${photoInit ? 'block' : 'none'};">
          <img class="photoPreview" src="${photoInit}" alt="Aperçu Photo">
          <button type="button" class="btn-suppr-photo-interne">❌ Supprimer</button>
        </div>
        <input type="file" class="fileGallery" accept="image/*" style="display: none;">
        <input type="file" class="fileCamera" accept="image/*" capture="environment" style="display: none;">
        <div class="camera-controls">
          <button type="button" class="btn-secondary btn-galerie">📁 Galerie</button>
          <button type="button" class="btn-secondary btn-photo-directe">📸 Photo</button>
        </div>
        <div class="form-group" style="margin-top: 0.75rem;"><label>Fournisseur</label><input type="text" class="input-fournisseur" value="${fournisseurInit}"></div>
        <div class="form-group"><label>Référence article</label><input type="text" class="input-ref" value="${refInit}"></div>
        <div class="form-group"><label>Code-barres ligne (EAN)</label><input type="text" class="input-barcode" value="${barcodeInit}"></div>
        <div class="form-group"><label>Quantité</label><input type="number" min="1" class="input-qte" value="${qteInit}"></div>
        <div class="form-group" style="margin-bottom: 0;"><label>💬 Remarque spécifique article</label><input type="text" class="input-article-remarque" value="${remArticleInit}"></div>
      `;

      const inputRef = bloc.querySelector('.input-ref');
      const inputFournisseur = bloc.querySelector('.input-fournisseur');
      const inputBarcode = bloc.querySelector('.input-barcode');
      const inputQte = bloc.querySelector('.input-qte');
      const inputArtRemarque = bloc.querySelector('.input-article-remarque');
      const previewWrapper = bloc.querySelector('.previewWrapper');
      const photoPreview = bloc.querySelector('.photoPreview');
      const btnSupprPhoto = bloc.querySelector('.btn-suppr-photo-interne');
      let photoData = photoInit;

      function verifierAutocompletion() {
        const ref = inputRef.value.trim();
        if (!ref) return;
        const cleNorm = "REF_" + ref.replace(/[.#$\/\[\]]/g, "_");
        let item = catalogueArticles[ref] || catalogueArticles[cleNorm];
        if (item && item.photo && !photoData) { photoData = item.photo; photoPreview.src = photoData; previewWrapper.style.display = 'block'; }
        if (item && item.fournisseur && !inputFournisseur.value.trim()) inputFournisseur.value = item.fournisseur;
        if (item && item.codeBarre && !inputBarcode.value.trim()) inputBarcode.value = item.codeBarre;
        if (item && item.quantite !== undefined && inputQte.value == "1") inputQte.value = item.quantite;
        if (item && item.remarqueArticle && !inputArtRemarque.value.trim()) inputArtRemarque.value = item.remarqueArticle;
      }
      inputRef.addEventListener('input', verifierAutocompletion);
      inputRef.addEventListener('blur', verifierAutocompletion);

      bloc.querySelector('.btn-galerie').addEventListener('click', () => bloc.querySelector('.fileGallery').click());
      bloc.querySelector('.btn-photo-directe').addEventListener('click', () => bloc.querySelector('.fileCamera').click());

      const handleFile = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            compresserImage(event.target.result, (comp) => {
              photoData = comp; photoPreview.src = photoData; previewWrapper.style.display = 'block';
              const ref = inputRef.value.trim();
              if (ref) {
                db.ref('catalogue_photos/REF_' + ref.replace(/[.#$\/\[\]]/g, "_")).update({
                  refOriginale: ref, photo: photoData, fournisseur: inputFournisseur.value.trim(), codeBarre: inputBarcode.value.trim(), quantite: Number(inputQte.value) || 1, remarqueArticle: inputArtRemarque.value.trim()
                }).catch(() => {});
              }
            });
          };
          reader.readAsDataURL(file);
        }
      };
      bloc.querySelector('.fileGallery').addEventListener('change', handleFile);
      bloc.querySelector('.fileCamera').addEventListener('change', handleFile);
      btnSupprPhoto.addEventListener('click', () => { photoData = ""; photoPreview.src = ""; previewWrapper.style.display = 'none'; });
      bloc.querySelector('.btn-retirer-article').addEventListener('click', () => { bloc.remove(); mettreAJourIndiceArticles(); });

      bloc.getArticleData = () => ({
        photo: photoData, fournisseur: inputFournisseur.value.trim(), ref: inputRef.value.trim(), codeBarre: inputBarcode.value.trim(), quantite: Number(inputQte.value) || 1, remarqueArticle: inputArtRemarque.value.trim()
      });

      articlesContainer.appendChild(bloc);
      mettreAJourIndiceArticles();
    }

    function mettreAJourIndiceArticles() {
      articlesContainer.querySelectorAll('.article-block').forEach((b, idx) => { b.querySelector('.article-index').textContent = idx + 1; });
    }

    btnAjouterArticle.addEventListener('click', () => ajouterBlocArticle());

    db.ref('commandes').on('value', (snapshot) => {
      const data = snapshot.val();
      commandes = [];
      if (data) {
        if (Array.isArray(data)) { commandes = data.filter(Boolean).map(nettoyerCommandeObjet); }
        else { Object.keys(data).forEach(key => { let cmd = data[key]; if (cmd) { if (!cmd.id) cmd.id = Number(key) || Date.now(); commandes.push(nettoyerCommandeObjet(cmd)); } }); }
        commandes.sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0));
      }
      afficherGalerie(inputRecherche.value);
    });

    btnEnregistrer.addEventListener('click', () => {
      requireAdmin(() => {
        const numero = inputNumero.value.trim();
        const blocsArticles = articlesContainer.querySelectorAll('.article-block');
        if (!numero || blocsArticles.length === 0) { alert("Numéro et au moins 1 article requis."); return; }
        let articlesList = Array.from(blocsArticles).map(b => b.getArticleData());
        btnEnregistrer.disabled = true; btnEnregistrer.textContent = "Enregistrement...";
        const idObjet = modeEditionId !== null ? modeEditionId : Date.now();
        const existingCmd = commandes.find(c => c.id === idObjet);
        const commandeData = { id: idObjet, numero, articles: articlesList, date: existingCmd?.date || new Date().toLocaleDateString('fr-FR'), isNew: false };
        db.ref('commandes/' + idObjet).set(commandeData).then(() => { reinitialiserFormulaire(); btnEnregistrer.disabled = false; }).catch(err => { btnEnregistrer.disabled = false; alert(err.message); });
      });
    });

    function reinitialiserFormulaire() {
      modeEditionId = null; inputNumero.value = ""; articlesContainer.innerHTML = "";
      btnEnregistrer.textContent = "Enregistrer les reliquats"; btnEnregistrer.disabled = false;
      btnAnnulerEdit.style.display = "none"; formTitle.textContent = "Nvx reliquats";
    }

    btnNouvelleCommande.addEventListener('click', () => { reinitialiserFormulaire(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    btnAnnulerEdit.addEventListener('click', reinitialiserFormulaire);

    window.editerCommande = function(id, event) {
      if (event) event.stopPropagation();
      requireAdmin(() => {
        const item = commandes.find(c => c.id === id); if (!item) return;
        modeEditionId = id; inputNumero.value = String(item.numero || '').trim(); articlesContainer.innerHTML = "";
        item.articles?.forEach(art => ajouterBlocArticle(art));
        btnEnregistrer.textContent = "💾 Sauvegarder les modifications"; btnAnnulerEdit.style.display = "inline-block";
        formTitle.textContent = "✏️ Modifier " + inputNumero.value; window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    };

    window.supprimerCommande = function(id, event) {
      if (event) event.stopPropagation();
      requireAdmin(() => {
        const item = commandes.find(c => c.id === id);
        if (item && confirm(`Supprimer reliquat ${item.numero} ?`)) { db.ref('commandes/' + id).remove().then(() => { if (modeEditionId === id) reinitialiserFormulaire(); }); }
      });
    };

    btnExportBackup.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      requireAdmin(() => {
        db.ref('/').once('value').then(snap => {
          const blob = new Blob([JSON.stringify(snap.val() || {}, null, 2)], { type: "application/json;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `backup_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });
      });
    });

    btnImportBackup.addEventListener('click', () => { dropdownMenu.classList.remove('show'); requireAdmin(() => fileRestoreJson.click()); });
    fileRestoreJson.addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          db.ref('/').set(data).then(() => { alert("Restauration OK"); chargerToutesLesDonnees(); }).catch(err => alert(err.message));
        } catch { alert("JSON invalide"); }
      };
      reader.readAsText(file);
    });

    btnViderHistorique.addEventListener('click', () => { dropdownMenu.classList.remove('show'); requireAdmin(() => { if (confirm("Effacer tout ?")) db.ref('commandes').remove(); }); });

    function afficherGalerie(filtre = "") {
      galerieCommandes.innerHTML = "";
      const dateFilterVal = dateFiltreExport ? dateFiltreExport.value : "";
      let targetDateFormatted = "";
      if (dateFilterVal) { const p = dateFilterVal.split('-'); if (p.length === 3) targetDateFormatted = `${p}/${p}/${p[0]}`; }
      const liste = commandes.filter(c => {
        if (!c || (targetDateFormatted && c.date !== targetDateFormatted)) return false;
        const fStr = String(filtre || '').toLowerCase();
        return String(c.numero || '').toLowerCase().includes(fStr) || c.articles?.some(a => String(a.fournisseur||'').toLowerCase().includes(fStr) || String(a.ref||'').toLowerCase().includes(fStr) || String(a.codeBarre||'').toLowerCase().includes(fStr));
      });
      badgeCount.textContent = `${liste.length} cmd • ${liste.reduce((acc, c) => acc + (c.articles?.reduce((s, a) => s + (Number(a.quantite)||1), 0)||0), 0)} art`;
      if (liste.length === 0) { galerieCommandes.innerHTML = `<p style="text-align:center; color:var(--subtext); padding:1rem;">Aucun reliquat trouvé.</p>`; return; }
      liste.forEach(cmd => {
        const item = document.createElement('div'); item.className = 'commande-item-compact';
        const nbA = cmd.articles?.reduce((acc, a) => acc + (Number(a.quantite)||1), 0)||0;
        item.innerHTML = `
          <input type="checkbox" class="commande-select-checkbox" data-id="${cmd.id}" onclick="event.stopPropagation()">
          <div class="commande-main-btn" onclick='ouvrirModal(${JSON.stringify(cmd).replace(/'/g, "&#39;")})'>
            <span>📦 (${nbA} art)</span>
            <div><div class="commande-num-badge">N° ${cmd.numero || ''}</div><div class="commande-date-compact">${cmd.date || ''}</div></div>
          </div>
          <div class="commande-actions">
            <button class="btn-edit-small" onclick="editerCommande(${cmd.id}, event)">✏️</button>
            <button class="btn-delete-small" onclick="supprimerCommande(${cmd.id}, event)">❌</button>
          </div>
        `;
        galerieCommandes.appendChild(item);
      });
    }

    let toutCoche = false;
    btnSelectAll.addEventListener('click', () => {
      toutCoche = !toutCoche;
      document.querySelectorAll('.commande-select-checkbox').forEach(cb => cb.checked = toutCoche);
      btnSelectAll.innerHTML = toutCoche ? "☑️ Tout décocher" : "☑️ Tout cocher";
    });
    dateFiltreExport.addEventListener('change', () => afficherGalerie(inputRecherche.value));

    window.ouvrirModal = function(cmd) {
      modal.style.display = "flex"; modalTitleBadge.innerHTML = `📦 N° ${cmd.numero || ''}`; modalImagesRow.innerHTML = "";
      cmd.articles?.forEach(art => {
        const box = document.createElement('div'); box.className = 'modal-photo-box';
        box.innerHTML = `${art.photo ? `<img src="${art.photo}">` : ''}<div class="modal-ref-group"><div class="modal-ref-badges">${art.fournisseur?`<div class="modal-fournisseur-badge">${art.fournisseur}</div>`:''}${art.ref?`<div class="modal-ref-badge">${art.ref}</div>`:''}</div><div style="display:flex;gap:0.4rem;"><span class="modal-barcode-badge">${art.codeBarre||''}</span><span class="modal-qty-badge">Qte: ${art.quantite||1}</span></div>${art.remarqueArticle?`<div class="modal-article-remarque-box">💬 ${art.remarqueArticle}</div>`:''}</div>`;
        modalImagesRow.appendChild(box);
      });
    };
    closeModal.addEventListener('click', () => modal.style.display = "none");
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = "none"; });

    function executerRecherche() { afficherGalerie(inputRecherche.value.trim()); }
    btnLancerRecherche.addEventListener('click', executerRecherche);
    inputRecherche.addEventListener('input', executerRecherche);
    inputRecherche.addEventListener('keypress', (e) => { if (e.key === 'Enter') executerRecherche(); });

    fileImportCSV.addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        let text = event.target.result; if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const lines = text.split(/\r\n|\n/).filter(l => l.trim() !== '');
        if (lines.length < 2) { alert("CSV vide"); fileImportCSV.value = ""; return; }
        db.ref('commandes').once('value').then(snap => {
          let existingData = snap.val() || {};
          let groupCommandes = {};
          Object.keys(existingData).forEach(k => { if (existingData[k]?.numero) groupCommandes[String(existingData[k].numero).trim()] = existingData[k]; });
          let parsedCount = 0;
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(lines[i].includes(';') ? ';' : ',').map(c => c.replace(/^"|"$/g, '').trim());
            if (cols.length < 7) continue;
            const [dateCSV, numeroClean, fournisseurCSV, barcodeCSV, refCSV, remArtCSV] = [cols[0], cols, cols, cols, cols, cols];
            const qteCSV = Number(cols) || 1;
            if (!numeroClean || !refCSV) continue;
            parsedCount++;
            const numClean = String(numeroClean).trim();
            if (!groupCommandes[numClean]) {
              groupCommandes[numClean] = { id: Date.now() + i, numero: numClean, date: dateCSV.includes('/') ? dateCSV : new Date().toLocaleDateString('fr-FR'), articles: [] };
            }
            if (!groupCommandes[numClean].articles.some(a => a.ref === refCSV)) {
              groupCommandes[numClean].articles.push({ photo: "", fournisseur: fournisseurCSV, ref: refCSV, codeBarre: barcodeCSV, quantite: qteCSV, remarqueArticle: remArtCSV });
            }
          }
          const keys = Object.keys(groupCommandes);
          if (keys.length > 0 && confirm(`Importer ${parsedCount} ligne(s) validée(s) sur ${keys.length} commande(s) ?`)) {
            let updates = {}; keys.forEach(k => updates[groupCommandes[k].id] = groupCommandes[k]);
            db.ref('commandes').update(updates).then(() => { 
              alert("Import réussi !"); 
              fileImportCSV.value = ""; 
              chargerToutesLesDonnees();
            });
          } else { fileImportCSV.value = ""; }
        });
      };
      reader.readAsText(file, 'utf-8');
    });

    btnImportSheets.addEventListener('click', () => fileImportCSV.click());

    btnExportExportCSV = document.getElementById('btnExportSheets');
    if(btnExportExportCSV) {
      btnExportExportCSV.addEventListener('click', () => {
        const dateSelect = dateFiltreExport.value;
        let listeAExporter = commandes;

        if (dateSelect) {
          const parts = dateSelect.split('-');
          const dateFormatee = `${parts}/${parts}/${parts[0]}`;
          listeAExporter = commandes.filter(cmd => cmd.date === dateFormatee);

          if (listeAExporter.length === 0) {
            alert(`Aucun reliquat trouvé pour la date du ${dateFormatee}.`);
            return;
          }
        } else {
          if (commandes.length === 0) {
            alert("L'historique est vide, aucun document à exporter.");
            return;
          }
        }

        let csvContent = "\uFEFF";
        csvContent += "Date;Numero de Commande;Fournisseur;Reference;CodeBarre;Quantite;RemarqueArticle\r\n";

        listeAExporter.forEach(cmd => {
          const date = `"${(cmd.date || "").replace(/"/g, '""')}"`;
          const numero = `"${(cmd.numero || "").replace(/"/g, '""')}"`;

          if (cmd.articles) {
            cmd.articles.forEach(art => {
              const f = `"${(art.fournisseur || "").replace(/"/g, '""')}"`;
              const r = `"${(art.ref || "").replace(/"/g, '""')}"`;
              const b = `"${(art.codeBarre || "").replace(/"/g, '""')}"`;
              const q = art.quantite !== undefined ? art.quantite : 1;
              const ra = `"${(art.remarqueArticle || "").replace(/"/g, '""')}"`;
              csvContent += `${date};${numero};${f};${r};${b};${q};${ra}\r\n`;
            });
          }
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `reliquats_export_${dateSelect || 'complet'}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    }

    btnExportPDF.addEventListener('click', () => {
      const checked = document.querySelectorAll('.commande-select-checkbox:checked');
      let list = checked.length > 0 ? commandes.filter(c => Array.from(checked).map(cb => Number(cb.getAttribute('data-id'))).includes(c.id)) : commandes;
      if (list.length === 0) { alert("Rien à exporter."); return; }
      let html = `<div class="print-title">Export Reliquats</div><div class="print-subtitle">Généré le ${new Date().toLocaleString('fr-FR')}</div><div class="print-grid">`;
      list.forEach(cmd => {
        html += `<div class="print-card"><h3>Réf: ${cmd.numero}</h3><div class="date">${cmd.date}</div><div class="print-photos-flex">`;
        cmd.articles?.forEach(art => {
          html += `<div class="print-photo-print-item">${art.photo?`<img src="${art.photo}">`:''}<div style="font-size:10px;"><b>${art.ref}</b> (Qté: ${art.quantite||1})</div></div>`;
        });
        html += `</div></div>`;
      });
      html += `</div>`;
      document.getElementById('print-area').innerHTML = html;
      setTimeout(() => window.print(), 300);
    });

    reinitialiserFormulaire();
  </script>
</body>
</html>
